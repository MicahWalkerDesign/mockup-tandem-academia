<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet" />
<meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet" />
<title>Tandem Academia mock-up</title>
<style>
:root{--accent:#198f9b;--accent2:#f08b3e;--deep:#184a57;--surface:#eef6f4;--ink:#172326;--bg:color-mix(in srgb,var(--surface) 86%,#fff);--card:color-mix(in srgb,var(--surface) 72%,#fff);--muted:color-mix(in srgb,var(--ink) 62%,#fff);--line:color-mix(in srgb,var(--accent) 25%,transparent)}
[data-theme=dark]{--bg:color-mix(in srgb,var(--deep) 78%,#000);--card:color-mix(in srgb,var(--deep) 68%,#000);--ink:#f7f2ea;--muted:rgba(247,242,234,.72);--line:rgba(255,255,255,.14)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(900px 480px at 78% 0%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 68%),linear-gradient(180deg,var(--bg),color-mix(in srgb,var(--bg) 78%,var(--accent2) 10%));color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit}.nav{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:14px clamp(16px,4vw,56px);border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px)}.brand{display:flex;align-items:center;gap:12px;min-width:0}.logo{display:grid;place-items:center;width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--deep));color:#fff;font-weight:900;letter-spacing:0}.brand strong,.brand small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand small{color:var(--muted);font-size:12px}.controls{display:flex;gap:6px;padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--card)}button{font:inherit}.controls button{height:32px;min-width:38px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-size:12px;font-weight:900;cursor:pointer}.controls button.active,.controls button:hover{background:var(--accent);color:#fff}.hero,.section{width:min(1180px,calc(100% - 36px));margin:0 auto}.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,430px);gap:clamp(28px,6vw,78px);align-items:center;min-height:calc(100vh - 80px);padding:48px 0 64px}.eyebrow{margin:0 0 12px;color:var(--accent);font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}h1,h2,h3{margin:0;color:var(--ink);letter-spacing:0;line-height:.96}h1{max-width:800px;font-size:clamp(42px,7vw,88px)}h2{font-size:clamp(32px,4vw,54px)}.sub{max-width:680px;margin:24px 0 0;color:var(--muted);font-size:clamp(17px,2vw,21px);line-height:1.65}.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border-radius:999px;font-weight:900;text-decoration:none}.primary{background:linear-gradient(135deg,var(--accent),var(--deep));color:#fff;box-shadow:0 18px 42px color-mix(in srgb,var(--accent) 24%,transparent)}.secondary{background:var(--card);border:1px solid var(--line)}.proof{display:flex;flex-wrap:wrap;gap:10px;margin:26px 0 0;padding:0;list-style:none}.proof li,.pill{padding:9px 12px;border:1px solid var(--line);border-radius:999px;background:color-mix(in srgb,var(--card) 82%,transparent);font-size:13px;font-weight:850}.device{display:grid;gap:16px;width:min(100%,390px);margin-left:auto;padding:16px;border:1px solid var(--line);border-radius:28px;background:linear-gradient(180deg,color-mix(in srgb,var(--card) 88%,#fff),var(--card));box-shadow:0 28px 90px rgba(0,0,0,.18)}[data-theme=dark] .device{box-shadow:0 28px 90px rgba(0,0,0,.36)}.deviceTop{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;font-weight:850}.placeholder{display:grid;place-items:center;aspect-ratio:4/3;border-radius:18px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 36%,#fff),color-mix(in srgb,var(--accent2) 30%,#fff))}.placeholder span{display:grid;place-items:center;width:92px;height:92px;border-radius:50%;background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.35);color:#fff;font-size:30px;font-weight:900}.mini{display:grid;grid-template-columns:42px 1fr;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:16px;background:color-mix(in srgb,var(--bg) 76%,transparent)}.mini i{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2))}.mini p{margin:0;font-weight:850}.section{padding:78px 0;border-top:1px solid var(--line)}.grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:28px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card,.panel,.contact,.form{border:1px solid var(--line);border-radius:8px;background:color-mix(in srgb,var(--card) 86%,transparent)}.card{min-height:150px;padding:20px}.card span{color:var(--accent);font-size:12px;font-weight:900}.card h3{margin-top:36px;font-size:23px;line-height:1.08}.panels{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{padding:clamp(22px,4vw,36px)}ol{display:grid;gap:14px;margin:28px 0 0;padding:0;list-style:none;counter-reset:step}ol li{position:relative;min-height:44px;padding-left:58px;color:var(--muted);font-weight:780}ol li:before{counter-increment:step;content:counter(step);position:absolute;left:0;top:-7px;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;font-weight:900}.pillbox{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}.contact{display:grid;grid-template-columns:.9fr 1.1fr;gap:28px;padding:clamp(22px,5vw,42px);margin-bottom:72px}.form{display:grid;gap:14px;padding:18px;background:color-mix(in srgb,var(--bg) 58%,transparent)}label{display:grid;gap:7px;color:var(--muted);font-size:13px;font-weight:850}input{min-height:48px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}.form button{border:0;cursor:pointer}.note{margin-top:18px;color:var(--muted);font-size:12px;line-height:1.5}@media(max-width:900px){.hero,.grid,.panels,.contact{grid-template-columns:1fr}.hero{min-height:auto;padding-top:34px}.device{width:100%;margin:0}.cards{grid-template-columns:1fr}}@media(max-width:560px){.nav{padding:12px}.brand strong{max-width:150px}.logo{width:44px;height:44px}.controls{max-width:156px;overflow:auto}.hero,.section{width:min(100% - 24px,1180px)}h1{font-size:clamp(38px,13vw,58px)}.sub{font-size:16px}.ctas{display:grid}.section{padding:54px 0}}
</style>
</head>
<body style="--accent:#B85B6A;--accent2:#4D8C8C;--deep:#3B2C52;--surface:#F7F1EA">
<header class="nav"><div class="brand"><span class="logo">TA</span><span><strong>Tandem Academia</strong><small>Academia · Vila-seca</small></span></div><div class="controls"><button data-lang="es" class="active">ES</button><button data-lang="ca">CA</button><button data-lang="en">EN</button><button data-theme-toggle>Oscuro</button></div></header>
<main>
<section class="hero"><div><p class="eyebrow" data-copy="eyebrow"></p><h1 data-copy="headline"></h1><p class="sub" data-copy="subhead"></p><div class="ctas"><a class="btn primary" href="#contact" data-copy="cta"></a><a class="btn secondary" href="#services" data-copy="secondary"></a></div><ul class="proof" data-proof></ul></div><aside class="device"><div class="deviceTop"><span>Academia</span><span>Vila-seca</span></div><div class="placeholder"><span>TA</span></div><div data-highlights></div><a class="btn primary" href="#contact" data-copy="cta"></a></aside></section>
<section class="section grid" id="services"><div><p class="eyebrow" data-copy="servicesLabel"></p><h2 data-copy="servicesTitle"></h2></div><div class="cards" data-services></div></section>
<section class="section panels"><article class="panel"><p class="eyebrow" data-copy="flowLabel"></p><h2 data-copy="flowTitle"></h2><ol data-flow></ol></article><article class="panel"><p class="eyebrow" data-copy="trustLabel"></p><h2 data-copy="trustTitle"></h2><div class="pillbox" data-trust></div></article></section>
<section class="section contact" id="contact"><div><p class="eyebrow">Concept mock-up</p><h2 data-copy="formTitle"></h2><p class="sub" data-copy="formText"></p><p class="note">Demo visual no oficial. Logos e imágenes son placeholders. Página marcada como noindex.</p></div><form class="form"><div data-fields></div></form></section>
</main><script>window.__COPY__={"es": {"eyebrow": "Academia · Vila-seca", "headline": "Una web que convierte dudas en matrículas.", "subhead": "Vi que para una academia local el primer objetivo no es una web bonita, sino que padres y alumnos entiendan cursos, horarios y matrícula rápido.", "cta": "Pedir información", "secondary": "Servicios", "proof": ["Móvil primero", "Tres idiomas", "Modo claro/oscuro"], "servicesLabel": "Servicios", "servicesTitle": "Servicios principales", "services": ["Refuerzo escolar", "ESO", "técnicas de estudio y preparación de exámenes."], "flowLabel": "Cómo funciona", "flowTitle": "Flujo sencillo", "flow": ["Elige lo que necesitas", "Envía datos básicos", "Recibe respuesta"], "trustLabel": "Confianza", "trustTitle": "Confianza antes de llamar", "trust": ["CTA visible", "Formulario simple", "Diseño profesional"], "formTitle": "Pedir información", "formText": "Envía una consulta corta y deja claro el siguiente paso.", "fields": ["Nombre", "Teléfono o email", "Motivo"]}, "ca": {"eyebrow": "Academia · Vila-seca", "headline": "Una web que converteix dubtes en matrícules.", "subhead": "Una pàgina conceptual enfocada en l’acció que més importa per a aquest negoci.", "cta": "Demanar informació", "secondary": "Serveis", "proof": ["Mòbil primer", "Tres idiomes", "Mode clar/fosc"], "servicesLabel": "Serveis", "servicesTitle": "Serveis principals", "services": ["Reforç escolar", "ESO", "tècniques d’estudi i preparació d’exàmens."], "flowLabel": "Com funciona", "flowTitle": "Flux senzill", "flow": ["Tria el que necessites", "Envia dades bàsiques", "Rep resposta"], "trustLabel": "Confiança", "trustTitle": "Confiança abans de trucar", "trust": ["CTA visible", "Formulari simple", "Disseny professional"], "formTitle": "Demanar informació", "formText": "Envia una consulta curta i deixa clar el següent pas.", "fields": ["Nom", "Telèfon o email", "Motiu"]}, "en": {"eyebrow": "Academia · Vila-seca", "headline": "A website that turns questions into enrolments.", "subhead": "A focused concept page designed around the action that matters most for this business.", "cta": "Request information", "secondary": "Services", "proof": ["Mobile first", "Three languages", "Light/dark mode"], "servicesLabel": "Services", "servicesTitle": "Core services", "services": ["School support", "secondary school", "study skills and exam preparation."], "flowLabel": "How it works", "flowTitle": "Simple flow", "flow": ["Choose what you need", "Send basic details", "Receive a reply"], "trustLabel": "Trust", "trustTitle": "Trust before calling", "trust": ["Visible CTA", "Simple form", "Professional design"], "formTitle": "Request information", "formText": "Send a short request and make the next step obvious.", "fields": ["Name", "Phone or email", "Reason"]}};</script><script>
const data = window.__COPY__;
let lang = 'es';
let theme = 'light';
function render(){
  document.documentElement.dataset.theme = theme;
  document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active', b.dataset.lang===lang));
  document.querySelector('[data-theme-toggle]').textContent = theme === 'light' ? (lang==='ca'?'Fosc':lang==='en'?'Dark':'Oscuro') : (lang==='ca'?'Clar':lang==='en'?'Light':'Claro');
  const c = data[lang];
  for (const [k,v] of Object.entries(c)) {
    const el = document.querySelector(`[data-copy="${k}"]`);
    if (el) el.textContent = v;
  }
  document.querySelector('[data-services]').innerHTML = c.services.map((s,i)=>`<article class="card"><span>${String(i+1).padStart(2,'0')}</span><h3>${s}</h3></article>`).join('');
  document.querySelector('[data-flow]').innerHTML = c.flow.map(s=>`<li>${s}</li>`).join('');
  document.querySelector('[data-trust]').innerHTML = c.trust.map(s=>`<span class="pill">${s}</span>`).join('');
  document.querySelector('[data-highlights]').innerHTML = c.highlights.map(s=>`<div class="mini"><i></i><p>${s}</p></div>`).join('');
  document.querySelector('[data-proof]').innerHTML = c.proof.map(s=>`<li>${s}</li>`).join('');
  document.querySelector('[data-fields]').innerHTML = c.fields.map(s=>`<label><span>${s}</span><input placeholder="${s}" /></label>`).join('') + `<button class="btn primary" type="button">${c.cta}</button>`;
}
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;render()}));
document.querySelector('[data-theme-toggle]').addEventListener('click',()=>{theme=theme==='light'?'dark':'light';render()});
render();
</script></body></html>
